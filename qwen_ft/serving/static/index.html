<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwen Chat</title>
<style>
  :root {
    --bg: #f7f7f8; --panel: #ffffff; --text: #1f2328; --muted: #6b7280;
    --border: #e5e7eb; --user: #2563eb; --user-text: #ffffff; --bot: #f1f3f5; --error: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111315; --panel: #1a1d21; --text: #e6e6e6; --muted: #9ca3af;
      --border: #2d3238; --user: #3b82f6; --user-text: #ffffff; --bot: #23272d; --error: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  header h1 { font-size: 16px; margin: 0; }
  header small { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #log { flex: 1; overflow-y: auto; padding: 16px; max-width: 820px; width: 100%; margin: 0 auto; }
  .msg { padding: 10px 14px; border-radius: 12px; margin: 8px 0; max-width: 85%; white-space: pre-wrap; word-wrap: break-word; }
  .user { background: var(--user); color: var(--user-text); margin-left: auto; }
  .assistant { background: var(--bot); }
  .error { color: var(--error); font-size: 14px; }
  .pending { color: var(--muted); font-style: italic; }
  form {
    display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border);
    background: var(--panel); max-width: 820px; width: 100%; margin: 0 auto;
  }
  textarea {
    flex: 1; resize: none; height: 48px; padding: 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit;
  }
  button {
    padding: 0 16px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font: inherit; cursor: pointer;
  }
  button[type=submit] { background: var(--user); color: var(--user-text); border-color: var(--user); }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>Qwen Chat</h1>
  <small id="model">connecting…</small>
</header>
<main id="log"></main>
<form id="form">
  <textarea id="input" placeholder="Ask a Java / Spring Boot question… (Enter to send, Shift+Enter for newline)" required></textarea>
  <button type="submit" id="send">Send</button>
  <button type="button" id="reset" title="Clear conversation">Reset</button>
</form>
<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  let history = [];

  function add(cls, text) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = text;  // textContent, never innerHTML: model output is untrusted
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  fetch("health").then(r => r.json())
    .then(h => { document.getElementById("model").textContent = h.model; })
    .catch(() => { document.getElementById("model").textContent = "server unreachable"; });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    send.disabled = true;
    add("user", text);
    const pending = add("assistant pending", "thinking…");
    // Server accepts at most 40 messages; keep the last 15 Q/A pairs (even count, so it starts with a user turn).
    const messages = [...history.slice(-30), { role: "user", content: text }];
    try {
      const res = await fetch("chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail));
      pending.className = "msg assistant";
      pending.textContent = data.reply;
      history = [...messages, { role: "assistant", content: data.reply }];
    } catch (err) {
      pending.className = "msg error";
      pending.textContent = "Error: " + err.message;
    } finally {
      send.disabled = false;
      input.focus();
    }
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });

  document.getElementById("reset").addEventListener("click", () => {
    history = [];
    log.replaceChildren();
    input.focus();
  });
</script>
</body>
</html>
