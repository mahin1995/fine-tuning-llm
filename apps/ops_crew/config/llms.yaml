# LLM profiles for the crew. Secrets are never stored here: `api_key_env` names the
# environment variable that holds the key. `${VAR:-default}` is expanded from the env.
#
# Which profile an agent uses:
#   1. OPS_LLM_PROFILE_<AGENT>   e.g. OPS_LLM_PROFILE_REVIEWER=anthropic   (one agent)
#   2. OPS_LLM_PROFILE           e.g. OPS_LLM_PROFILE=openai                (every agent)
#   3. `llm:` in agents.yaml
# `fallbacks` are tried in order when a call to the profile's provider fails; a fallback
# whose API key isn't set is skipped (so a local-only setup still works).
# Temperature is always forced to 0 by the factory, whatever is written here.

profiles:
  local:            # any OpenAI-compatible server: Ollama, vLLM, llama.cpp, LM Studio
    provider: openai_compatible
    model: openai/${OPS_LOCAL_MODEL:-qwen2.5:7b-instruct}
    base_url: ${OPS_LOCAL_BASE_URL:-http://localhost:11434/v1}
    api_key_env: OPS_LOCAL_API_KEY
    api_key_required: false
    timeout: 120
    fallbacks: [openai, anthropic]

  openai:
    provider: openai_compatible
    model: openai/${OPS_OPENAI_MODEL:-gpt-4o-mini}
    api_key_env: OPENAI_API_KEY
    timeout: 60

  anthropic:        # needs crewai[anthropic] (in apps/requirements.txt)
    provider: anthropic
    model: anthropic/${OPS_ANTHROPIC_MODEL:-claude-sonnet-5}
    api_key_env: ANTHROPIC_API_KEY
    timeout: 60
    max_tokens: 2048

  finetuned:        # a model fine-tuned with this repo (finetune/), in-process. Experimental: a 0.6B model
    provider: finetuned  # rarely produces valid multi-agent JSON; useful to measure that with the evals.
    model: ${OPS_FINETUNED_MODEL_PATH:-outputs/qwen3-ft}
    max_tokens: 1024
